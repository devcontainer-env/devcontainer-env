name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run Tests
        run: nix develop --command cargo test

  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs on pull requests created with the default GITHUB_TOKEN wait for approval,
      # so the release PR is created as the GitHub App instead.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Create Release PR
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          manifest-file: .github/config/release-please-manifest.json
          config-file: .github/config/release-please-config.json
          target-branch: main

  build:
    # Builds on every run, so a broken binary shows up before a release; uploads on releases.
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Plain cargo, not Nix: the binaries must not depend on /nix/store
      - name: Install Rust
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Check the binary runs on its own
        run: |
          bin=target/${{ matrix.target }}/release/devcontainer-env
          file "$bin"
          if [ "$RUNNER_OS" = macOS ]; then
            otool -L "$bin"
            ! otool -L "$bin" | grep -q /nix/store
          else
            file "$bin" | grep -Eq 'static(ally|-pie)? linked'
          fi
          case "${{ matrix.target }}" in
            x86_64-apple-darwin) ;; # cross-compiled; the arm64 runner can't always run it
            *) "$bin" --version ;;
          esac

      - name: Prepare Release Assets
        if: ${{ needs.release.outputs.release_created }}
        run: |
          mkdir -p release && install -m 0755 target/${{ matrix.target }}/release/devcontainer-env release/devcontainer-env-${{ matrix.target }}

      - name: Upload Release Assets
        if: ${{ needs.release.outputs.release_created }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release.outputs.tag_name }}
          files: release/devcontainer-env-${{ matrix.target }}

  publish:
    # Runs after every binary built, so a release that fails to build is not published
    needs: [release, build]
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # Trusted publishing: exchanges the job's OIDC token for a short-lived crates.io token
      - name: Authenticate with Crates.io
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish to Crates.io
        run: nix develop --command cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Pins the binaries just published in
  # .github/config/nix-release-bin-manifest.json, so the flake installs them
  # instead of building from source. The pull request is opened with the App
  # token, as one opened with GITHUB_TOKEN starts no CI.
  pin:
    needs: [release, build]
    # build also runs when nothing was released.
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Pin Release Binaries
        id: pin
        uses: nixos-contrib/nix-release-bin@main
        with:
          tag: ${{ needs.release.outputs.tag_name }}
          manifest-file: .github/config/nix-release-bin-manifest.json

      - name: Create Pull Request
        if: steps.pin.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: nix/release-binaries
          commit-message: "chore(nix): pin the ${{ steps.pin.outputs.version }} release binaries"
          title: "chore(nix): pin the ${{ steps.pin.outputs.version }} release binaries"
          labels: auto-merge
